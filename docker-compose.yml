services:
  aur-builder:
    image: ghcr.io/dr-blank/aur-builder:latest
    # Required: systemd-nspawn (devtools clean chroot) needs elevated privileges
    privileged: true
    tty: true
    restart: unless-stopped

    volumes:
      # Output: pacman repository (packages + db files land here)
      - ./repo:/repo

      # Input: package list (one name per line, # comments supported)
      - ./packages.txt:/packages.txt:ro

      # Persist pacman download cache — avoids re-downloading deps on every build
      # Works for both USE_CHROOT=0 and USE_CHROOT=1 (host-side installs)
      - pacman-cache:/var/cache/pacman/pkg

      # Optional: persist build chroot across runs (USE_CHROOT=1 only)
      # Caches the chroot environment itself; speeds up clean chroot builds
      # - aur-chroot:/var/lib/aurbuild

      # Optional: custom mirrorlist — override the default Arch mirrors
      # Generate with reflector or pick from https://archlinux.org/mirrorlist/
      # To use pacoloco as a caching proxy, see docker-compose.pacoloco.yml
      # - ./mirrorlist:/etc/pacman.d/mirrorlist:ro

    tmpfs:
      # systemd-nspawn (devtools) creates bind mounts under /run/systemd/nspawn/propagate/
      # during chroot builds. Docker's overlay fs is seen as a "disk filesystem" by
      # systemd's umount safety check, causing cleanup to fail with exit 1.
      # tmpfs here makes statfs() return TMPFS_MAGIC → cleanup succeeds.
      - /run/systemd/nspawn:exec,mode=755
      - /run/systemd/journal:exec,mode=755

    environment:
      # Cron schedule(s) for automatic builds. Use | to separate multiple schedules.
      # Leave empty to run once and exit (one-shot mode).
      # Examples:
      #   CRON: "0 2 * * *"                  # daily at 2 AM
      #   CRON: "0 2 * * *|0 14 * * *"       # 2 AM and 2 PM
      CRON: "0 2 * * *"

      # Set to 1 to run a build immediately on container start before the cron schedule takes over.
      RUN_ON_START: "1"

      # Space-separated package names - merged with packages.txt at runtime
      PACKAGES: ""

      # Set to 0 to skip clean chroot - fast builds for local testing (no systemd-nspawn)
      # Set to 1 (default) for reproducible clean chroot builds via devtools
      USE_CHROOT: "1"

      # Overrides (optional):
      # MAKEFLAGS: "-j4"         # default: -j$(nproc) - all available cores
      # SKIP_PGP_CHECK: "1"      # skip GPG signature checks (fallback if keyserver unreachable)

      # Space-separated pacman packages to install before building
      # Installed into the chroot (USE_CHROOT=1) or directly on the host (USE_CHROOT=0).
      # Use this for build-time deps a specific AUR package needs (e.g. perl-podlators for pod2man).
      # EXTRA_PACKAGES: "perl-podlators"

volumes:
  pacman-cache:
  # aur-chroot:
